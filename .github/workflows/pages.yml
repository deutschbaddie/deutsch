# Publishes the site to GitHub Pages on every push.
# `enablement: true` turns Pages on the first time this runs, so there is
# nothing to switch on by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/dazzling-franklin-23ekak"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Turn Pages on if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package the whole repo — it is a static site, nothing to build
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
