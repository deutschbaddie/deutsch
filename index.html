<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Lab — German A1</title>
<meta name="description" content="A complete German A1 course in English: slide lessons, real everyday German, and a TikTok decoder.">
<meta name="theme-color" content="#070c13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png"><text y='.9em' font-size='90'>🇩🇪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-flag">🇩🇪</div>
    <div class="boot-title">Deutsch Lab</div>
    <div class="boot-sub" id="bootMsg">Loading the course…</div>
    <div class="boot-bar"><i id="bootBar"></i></div>
  </div>
</div>

<header class="topbar" hidden>
  <button class="brand" data-go="#/">
    <span class="brand-mark">DL</span>
    <span class="brand-text">Deutsch&nbsp;Lab</span>
  </button>
  <div class="topbar-stats">
    <div class="stat" title="Day streak"><span class="stat-ico">🔥</span><b id="statStreak">0</b></div>
    <div class="stat" title="Words that stick"><span class="stat-ico">📚</span><b id="statWords">0</b></div>
    <div class="stat" title="Points"><span class="stat-ico">⚡</span><b id="statXp">0</b></div>
  </div>
  <button class="icon-btn" id="btnSettings" aria-label="Settings">⚙️</button>
</header>

<nav class="rail" hidden>
  <a class="rail-item" data-route="home" href="#/"><span>📘</span><i>Course</i></a>
  <a class="rail-item" data-route="trainer" href="#/trainer"><span>🎯</span><i>Drill</i></a>
  <a class="rail-item" data-route="decoder" href="#/decoder"><span>📱</span><i>Decoder</i></a>
  <a class="rail-item" data-route="glossar" href="#/glossar"><span>🔤</span><i>Words</i></a>
  <a class="rail-item" data-route="ich" href="#/ich"><span>📈</span><i>Me</i></a>
</nav>

<main id="app" class="app" hidden></main>

<div class="sheet" id="settingsSheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-head"><h3>Settings</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="sheet-body" id="settingsBody"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="assets/js/core.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/srs.js"></script>
<script src="assets/js/exercises.js"></script>
<script src="assets/js/deck.js"></script>
<script src="assets/js/views.js"></script>
<script src="content/registry.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
